# SWIFT deferred due to execution cost; SGP replaces it. Reuse completed other-algorithm trials.
version: 1
name: cifar10-gnlenet-32-additions-sgp
output: ../output/leaderboard-cifar10-32-extended-sgp
benchmark:
  budgets:
  - 60
  - 300
  - 900
  seeds:
  - 10
  - 11
  - 12
  evaluation_period: 60
  evaluation_model: global
  execution_devices:
  - cuda:0
  - cuda:1
  - cuda:0
  - cuda:1
  accuracy_targets:
  - 30
  - 40
  - 50
  - 60
  - 70
  - 80
  network:
    profile: uniform
    bandwidth_bytes_per_second: 1000000
    compute_step_ms: 20
settings:
  dataset: cifar10
  dataset_base_path: ../data/cifar10
  model: gnlenet
  device: cuda:0
  peers: 32
  partitioner: iid
  validation_set_fraction: 0.1
  evaluation_split: test
  evaluation_examples: 0
  local_steps: 1
  batch_size: 32
  momentum: 0
  weight_decay: 0
  network_latency_ms: 10
  torch_threads: 4
runs:
- name: sgp
  settings:
    algorithm: sgp
    sgp_topology: exponential
- name: gt-dsgd
  settings:
    algorithm: gt-dsgd
    gt_dsgd_topology: ring
- name: motef
  settings:
    algorithm: motef
    motef_topology: ring
    motef_compressor: topk
    motef_keep_ratio: 0.1
    motef_consensus_stepsize: 0.1
    motef_momentum_weight: 0.1
- name: relaysgd
  settings:
    algorithm: relaysgd
    relaysgd_topology: balanced
    relaysgd_normalization: counts
- name: damsgrad
  settings:
    algorithm: damsgrad
    damsgrad_topology: ring
    damsgrad_beta1: 0.9
    damsgrad_beta2: 0.999
    damsgrad_epsilon: 1.0e-06
tuning:
  budget: 300
  seeds:
  - 0
  evaluation_period: 300
  evaluation_examples: 1000
  metric: accuracy
  learning_rates:
    sgp:
    - 0.003
    - 0.01
    - 0.03
    - 0.1
    - 0.3
    gt-dsgd:
    - 0.003
    - 0.01
    - 0.03
    - 0.1
    - 0.3
    motef:
    - 0.003
    - 0.01
    - 0.03
    - 0.1
    - 0.3
    relaysgd:
    - 0.003
    - 0.01
    - 0.03
    - 0.1
    - 0.3
    damsgrad:
    - 1.0e-05
    - 3.0e-05
    - 0.0001
    - 0.0003
    - 0.001
