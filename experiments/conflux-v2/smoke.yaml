version: 1
name: conflux-v2-config-smoke
execution: local
output: ../../output/conflux-v2-config-smoke
settings:
  algorithm: conflux-v2
  dataset: digits
  model: mlp
  device: cpu
  peers: 8
  sample_size: 4
  chunks_in_sample: 4
  relay_count: 8
  immediate_uploads: true
  success_fraction: 1
  seed: 0
  stop: duration
  duration: 20
  test_period: 5
  test_interval: 0
  test_method: snapshot
  evaluation_split: validation
  final_heldout: true
  learning_rate: 0.1
  momentum: 0
  local_steps: 5
  batch_size: 16
  torch_threads: 1
  bandwidth_bytes_per_s: 10000
  compute_step_ms: 20
  network_latency_ms: 20
matrix:
  partitioner: [iid, dirichlet]
  capacity_profile: [uniform, heterogeneous]
