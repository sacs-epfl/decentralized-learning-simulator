version: 1
name: cifar10-gnlenet-centralized-minloss
output: ../output/leaderboard-cifar10-centralized-minloss
settings:
  dataset: cifar10
  dataset_base_path: ../data/cifar10
  model: gnlenet
  device: cuda:0
  validation_set_fraction: 0.1
  local_steps: 1
  batch_size: 32
  momentum: 0
  weight_decay: 0
  torch_threads: 4
training:
  steps: 50000
  evaluation_period: 1000
tuning:
  steps: 5000
  seeds: [0]
  learning_rates: [0.003, 0.01, 0.03, 0.1, 0.3]
  evaluation_examples: 1000
evaluation:
  seeds: [10, 11, 12]
