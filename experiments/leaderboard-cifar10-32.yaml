version: 1
name: cifar10-gnlenet-32-tuned
output: ../output/leaderboard-cifar10-32
benchmark:
  budgets: [60, 300]
  seeds: [10, 11, 12]
  evaluation_period: 60
  accuracy_targets: [30, 40, 50, 60]
  network:
    profile: uniform
    bandwidth_bytes_per_second: 1000000
    compute_step_ms: 20
tuning:
  budget: 300
  seeds: [0]
  evaluation_period: 300
  evaluation_examples: 1000
  metric: accuracy
  learning_rates:
    fedavg: [0.003, 0.01, 0.03, 0.1, 0.3]
    dpsgd-ring: [0.003, 0.01, 0.03, 0.1, 0.3]
    qgm: [0.003, 0.01, 0.03, 0.1, 0.3]
    choco: [0.003, 0.01, 0.03, 0.1, 0.3]
    demo: [0.0001, 0.0003, 0.001, 0.003, 0.01]
settings:
  dataset: cifar10
  dataset_base_path: ../data/cifar10
  model: gnlenet
  device: cuda:0
  peers: 32
  partitioner: iid
  validation_set_fraction: 0.1
  evaluation_split: test
  evaluation_examples: 0
  local_steps: 1
  batch_size: 32
  momentum: 0
  weight_decay: 0
  network_latency_ms: 10
  torch_threads: 4
runs:
  - name: fedavg
    settings: {algorithm: fl, sample_size: 32}
  - name: dpsgd-ring
    settings: {algorithm: dpsgd, topology: ring}
  - name: qgm
    settings: {algorithm: qgm, qgm_topology: ring}
  - name: choco
    settings: {algorithm: choco, choco_topology: ring, choco_keep_ratio: 0.1, choco_consensus_stepsize: 0.1}
  - name: demo
    settings: {algorithm: demo, demo_decay: 0.999, demo_chunk: 64, demo_topk: 32}
